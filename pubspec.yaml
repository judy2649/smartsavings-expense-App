name: smart_savings
description: A Smart Savings & Expense Budgeting App similar to Wallet by BudgetBakers.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  
  # State Management
  provider: ^6.0.0
  get_it: ^9.2.0
  
  # UI & Navigation
  go_router: ^17.0.1
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  
  # Charts & Analytics
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.25
  
  # Date & Time
  intl: ^0.20.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  uuid: ^4.0.0
  http: ^1.1.0
  dio: ^5.3.1
  shared_preferences: ^2.2.2
  crypto: ^3.0.2
  
  # PDF & Export
  pdf: ^3.10.6
  printing: ^5.11.0
  
  # Payment (for premium features)
  in_app_purchase: ^3.1.8
  
  # Analytics
  firebase_analytics: ^12.1.1
  
  # Animations
  flutter_animate: ^4.2.0
  
  # Form handling
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
  
  # Fonts commented out for now (will use system fonts)
  # Uncomment and add font files when available
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
