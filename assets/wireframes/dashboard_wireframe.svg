<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="12" y="16" width="336" height="56" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="24" y="52" font-family="Arial" font-size="16" fill="#111827">Dashboard</text>

  <!-- Balance card -->
  <rect x="12" y="88" width="336" height="96" rx="12" fill="#F8FAFC" stroke="#E6EEF8"/>
  <text x="28" y="118" font-family="Arial" font-size="12" fill="#6B7280">Total balance</text>
  <text x="28" y="146" font-family="Arial" font-size="20" font-weight="700" fill="#111827">KSH 12,345</text>

  <!-- Quick actions -->
  <g transform="translate(12,200)">
    <rect x="0" y="0" width="78" height="78" rx="12" fill="#F3F4F6"/>
    <rect x="92" y="0" width="78" height="78" rx="12" fill="#F3F4F6"/>
    <rect x="184" y="0" width="78" height="78" rx="12" fill="#F3F4F6"/>
    <rect x="276" y="0" width="78" height="78" rx="12" fill="#F3F4F6"/>
    <text x="20" y="48" font-family="Arial" font-size="12" fill="#374151">+ Add</text>
    <text x="112" y="48" font-family="Arial" font-size="12" fill="#374151">Budget</text>
    <text x="204" y="48" font-family="Arial" font-size="12" fill="#374151">Goal</text>
    <text x="296" y="48" font-family="Arial" font-size="12" fill="#374151">Connect</text>
  </g>

  <!-- Budgets preview -->
  <rect x="12" y="294" width="260" height="88" rx="12" fill="#FEFBEB" stroke="#FFF3CD"/>
  <text x="28" y="326" font-family="Arial" font-size="14" fill="#92400E">Groceries • 60%</text>

  <!-- Spending breakdown -->
  <rect x="12" y="392" width="336" height="120" rx="12" fill="#F8FAFC" stroke="#E6EEF8"/>
  <text x="28" y="422" font-family="Arial" font-size="14" fill="#111827">Spending breakdown</text>
  <text x="28" y="448" font-family="Arial" font-size="12" fill="#6B7280">Food — 32%  •  Transport — 18%  •  Bills — 12%</text>

  <!-- Recent transactions -->
  <text x="24" y="540" font-family="Arial" font-size="14" fill="#111827">Recent transactions</text>
  <rect x="12" y="556" width="336" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="12" y="622" width="336" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- Footer hint -->
  <text x="24" y="740" font-family="Arial" font-size="12" fill="#9CA3AF">Prototype wireframe — Dashboard</text>
</svg>